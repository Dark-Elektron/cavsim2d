[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cavsim2d"
dynamic = ["version"]
description = "Quick 2D axisymmetric RF cavity analysis: eigenmode, tuning, wakefield, UQ and optimisation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sosoho-Abasi Udongwo", email = "numurho@gmail.com" }]
keywords = ["rf-cavity", "accelerator", "eigenmode", "wakefield", "finite-element", "ngsolve"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]

# Core runtime dependencies. NGSolve pulls in netgen. The eigenmode pipeline
# needs gmsh for meshing. Wakefield additionally needs ABCI, which is not
# shipped: users download it from KEK (https://abci.kek.jp/abci.htm) — see the
# README.
dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.13.1",
    "pandas>=2.2.2",
    "matplotlib>=3.8.4",
    "ngsolve>=6.2.2402",
    "gmsh>=4.13",
    "paretoset>=1.2.4",
    "termcolor>=2.1.0",
    "tqdm>=4.66.4",
    "openpyxl",
    "jinja2",          # pandas' Styler, used to write the optimisation Pareto table
    "joblib",
    "scikit-learn>=1.6",
    "SALib",
    # NGSolve's interactive viewer (cav.show_fields/show_mesh/show_geometry) draws
    # nothing without its widget package, and ngsolve does not depend on it.
    # NGSolve 6.2.26xx renders through anywidget, earlier releases through
    # webgui_jupyter_widgets; both are small pure-Python wheels.
    "ipywidgets>=8.1.3",
    "anywidget>=0.9",
    "webgui_jupyter_widgets>=0.2.18",
]

[project.optional-dependencies]
# A kernel and a front end for the example notebooks (VS Code needs only the
# kernel). The widget packages themselves are core dependencies above.
jupyter = ["ipykernel", "jupyterlab"]
# Test + lint tooling.
dev = ["pytest", "flake8"]
# Documentation building
docs = ["sphinx-immaterial>=0.11", "sphinxcontrib-bibtex", "numpydoc", "myst-nb"]

[project.urls]
Homepage = "https://github.com/Dark-Elektron/cavsim2d"
Repository = "https://github.com/Dark-Elektron/cavsim2d"

[tool.setuptools.dynamic]
version = { attr = "cavsim2d.__version__" }

[tool.setuptools.packages.find]
include = ["cavsim2d*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
# Ship the default secondary-emission-yield table for multipacting.
# ABCI is never shipped: MANIFEST.in excludes a local copy kept in a checkout.
"cavsim2d.data_module" = ["sey/*"]
